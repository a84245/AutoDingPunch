# AutoDingPunch 自动构建工作流
# 触发方式：
#   - push / pull request 到 main 分支
#   - 手动触发（Actions 页面点 "Run workflow"），可传版本号参数
# 产物：
#   - Debug APK（可直接安装）
#   - Release APK（默认未签名；配置签名 Secrets 后自动签名）
# 签名 Secrets（可选，仓库 Settings -> Secrets and variables -> Actions）：
#   KEYSTORE_BASE64   - keystore 文件的 base64 内容
#   KEYSTORE_PASSWORD - keystore 密码
#   KEY_ALIAS         - 别名
#   KEY_PASSWORD      - 别名密码
name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本号（如 1.1.0），留空则用 build.gradle 里的版本'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # 配置了签名 Secrets 时，把 keystore 解密到工作目录
      - name: 解密签名 keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/keystore.jks"
            echo "keystore 已就绪"
          else
            echo "未配置签名 Secrets，Release 将生成未签名 APK"
          fi

      - name: 写入版本号（手动触发时）
        if: ${{ github.event.inputs != null && github.event.inputs.version_name != '' }}
        run: |
          sed -i "s/versionName \".*\"/versionName \"${{ github.event.inputs.version_name }}\"/" app/build.gradle

      - name: 构建 Debug + Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 摘要
        run: |
          echo "## 构建完成 ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Debug APK：app/build/outputs/apk/debug/" >> $GITHUB_STEP_SUMMARY
          echo "- Release APK：app/build/outputs/apk/release/" >> $GITHUB_STEP_SUMMARY
          echo "- 在 Actions 运行页面的 Artifacts 区域下载" >> $GITHUB_STEP_SUMMARY
