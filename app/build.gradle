plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// GitHub Actions 签名支持：配置了 KEYSTORE_BASE64 环境变量时自动签名 release，
// 本地构建或未配置时保持未签名，行为不变。
def keystoreBase64 = System.getenv("KEYSTORE_BASE64")
def hasSigning = keystoreBase64 != null && !keystoreBase64.isEmpty()

android {
    namespace 'com.autoding.punch'
    compileSdk 34

    defaultConfig {
        applicationId "com.autoding.punch"
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName "1.0.8"
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file("${rootProject.rootDir}/keystore.jks")
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.4'
}
